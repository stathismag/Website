name: Temporary abstract lookup (remove after use)
on:
  push:
    branches: [claude/website-font-change-g6jg0d]
    paths: [.github/workflows/tmp_abstract_lookup.yml]
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch abstracts from Crossref, OpenAlex and Semantic Scholar
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.parse
          UA = {"User-Agent": "smagerakis.gr abstract lookup (mailto:smagerakis@upatras.gr)"}
          def get(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=30))
          def clean(t):
              t = re.sub(r"<[^>]+>", " ", t or "")
              return re.sub(r"\s+", " ", t).strip()
          def from_crossref(d):
              return clean(get("https://api.crossref.org/works/" + d)["message"].get("abstract"))
          def from_openalex(d):
              inv = get("https://api.openalex.org/works/doi:" + d).get("abstract_inverted_index")
              if not inv: return ""
              words = sorted((p, w) for w, ps in inv.items() for p in ps)
              return " ".join(w for _, w in words)
          def from_s2(d):
              return clean(get("https://api.semanticscholar.org/graph/v1/paper/DOI:" + d + "?fields=abstract").get("abstract"))
          dois = """10.1002/bse.70317 10.1007/s00187-025-00397-6 10.1007/s11846-025-00923-9 10.1108/JAL-03-2024-0036
          10.1007/s10479-024-06176-1 10.1016/j.jcorpfin.2023.102448 10.1108/JAAR-11-2021-0310 10.1108/MD-07-2021-0991
          10.1108/RAF-10-2021-0284 10.1111/irfi.12355 10.1007/s12351-021-00660-3 10.1016/j.jclepro.2021.127014
          10.1108/JAAR-05-2019-0077 10.3390/jrfm13080163 10.1504/IJMFA.2020.10031398""".split()
          for d in dois:
              out = {"doi": d}
              for name, fn in (("crossref", from_crossref), ("openalex", from_openalex), ("s2", from_s2)):
                  try:
                      out[name] = fn(d)
                  except Exception as e:
                      out[name] = "ERROR " + str(e)[:80]
              print("ABSTRACT " + json.dumps(out, ensure_ascii=False))
          # The 2015 paper has no DOI: search OpenAlex by title
          try:
              q = urllib.parse.quote("Cash holdings and firm characteristics: Evidence from UK market")
              r = get("https://api.openalex.org/works?search=" + q + "&per-page=3")
              for w in r.get("results", []):
                  inv = w.get("abstract_inverted_index") or {}
                  words = sorted((p, x) for x, ps in inv.items() for p in ps)
                  print("ABSTRACT " + json.dumps({"title_search": w.get("title"), "venue": ((w.get("primary_location") or {}).get("source") or {}).get("display_name"),
                                                  "year": w.get("publication_year"), "openalex": " ".join(x for _, x in words)}, ensure_ascii=False))
          except Exception as e:
              print("ABSTRACT title search error", e)
          PY
