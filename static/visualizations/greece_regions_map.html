<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greek regions: uncertainty, R&amp;D and performance</title>
<meta name="description" content="Interactive map of environmental uncertainty, R&D intensity and ROA across Greek NUTS 2 regions, 2007–2014 (Magerakis & Theodoraki, Review of Managerial Science).">
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11,11,11,0.10); --nodata: #e1e0d9; --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --border: rgba(255,255,255,0.10); --nodata: #383835; --accent: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 4px; }
  .sub { color: var(--ink-2); margin: 0 0 20px; font-size: 0.95rem; }
  .sub a, .notes a { color: var(--accent); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
  .seg button { font: inherit; font-size: 0.9rem; padding: 8px 12px; border: 0; background: transparent;
                color: var(--ink-2); cursor: pointer; min-height: 40px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .lang { margin-left: auto; font-size: 0.9rem; color: var(--ink-2); }
  .lang a { color: var(--accent); }
  .layout { display: grid; grid-template-columns: minmax(0, 3fr) minmax(220px, 2fr); gap: 20px; align-items: start; }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }
  svg.map { width: 100%; height: auto; display: block; }
  svg.map path { stroke: var(--surface); stroke-width: 1.2; stroke-linejoin: round; cursor: pointer; outline: none; }
  svg.map path.active, svg.map path:focus-visible { stroke: var(--ink); stroke-width: 2; }
  .legend { margin: 4px 0 16px; }
  .legend-title { font-size: 0.85rem; color: var(--ink-2); margin-bottom: 6px; }
  .legend-bar { height: 12px; border-radius: 4px; }
  .legend-ticks { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted);
                  font-variant-numeric: tabular-nums; margin-top: 4px; }
  .legend-nodata { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; background: var(--nodata); display: inline-block; }
  .detail h2 { font-size: 1.1rem; margin: 0 0 8px; }
  .detail dl { display: grid; grid-template-columns: auto auto; gap: 4px 12px; margin: 0; font-size: 0.95rem; }
  .detail dt { color: var(--ink-2); }
  .detail dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .detail .hint { color: var(--muted); font-size: 0.85rem; margin-top: 10px; }
  .tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink);
         border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 0.85rem;
         box-shadow: 0 4px 16px rgba(0,0,0,0.15); display: none; z-index: 10; max-width: 240px; }
  .tip b { display: block; margin-bottom: 2px; }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--accent); }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 0.9rem; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--grid); text-align: right; font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--ink-2); font-weight: 600; }
  .notes { color: var(--ink-2); font-size: 0.85rem; margin-top: 16px; }
</style>
</head>

        <div class="detail" id="detail" aria-live="polite"></div>
      </div>
    </div>
    <details>
      <summary id="tableToggle"></summary>
      <table id="table"></table>
    </details>
  </div>
  <p class="notes" id="notes"></p>
</main>

    rows.map(id => `<tr><td>${NAMES[lang][id]}</td><td>${fmt("eu", DATA[id].eu)}</td><td>${fmt("rd", DATA[id].rd)}</td><td>${fmt("roa", DATA[id].roa)}</td></tr>`).join("") +
    `</tbody>`;
}
dark.addEventListener("change", render);
render();
</script>
</body>
